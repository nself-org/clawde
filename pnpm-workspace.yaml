# clawde JS/TS pnpm workspace
# Includes the RN mobile app and desktop Tauri app.
# @nself/* shared packages are resolved from the packages/ sibling workspace via relative path.
packages:
  - 'apps/desktop'
  - 'apps/mobile'
  - '../packages/@nself/*'

# Dependency overrides and audit settings. pnpm 10+ reads them here; pnpm 12
# no longer reads the "pnpm" field of package.json.
overrides:
  'esbuild@<=0.24.2': '>=0.25.0'
  'uuid@<11.1.1': '>=11.1.1'
  'vitest@<3.2.6': '>=3.2.6'
  'esbuild@>=0.27.3 <0.28.1': '>=0.28.1'
  'vite@<=6.4.3': '>=6.4.4 <7'
  'storybook@<8.6.19': '>=8.6.19 <9'
  '@storybook/core@<8.6.19': '>=8.6.19 <9'
  'markdown-it@<14.3.1': '^14.3.1'
  'dompurify@<3.4.16': '>=3.4.16'
  'immutable': '>=5.1.8'
  'js-yaml@<4.3.2': '>=4.3.2'
  'js-yaml@>=5 <5.4.1': '>=5.4.1'
  'decode-uri-component@<0.5.0': '>=0.5.0'
  'linkify-it': '>=5.0.2'
  'nanoid': '>=3.3.18'
  'postcss': '>=8.5.18'
  'shell-quote': '>=1.9.0'
  'tar': '>=7.5.19'
  'undici': '>=7.29.1 <8'
  '@fastify/busboy': '>=3.2.1'
  'brace-expansion@1': '^1.1.20'
  'brace-expansion@2': '^2.1.6'
  'brace-expansion@3': '^5.0.11'
  'brace-expansion@4': '^5.0.11'
  'brace-expansion@5': '^5.0.11'
  'browserslist@<4.28.7': '^4.28.7'
  '@xmldom/xmldom': '>=0.9.12'
  # Metro 0.83.8 removes image-size (GHSA-5p2g-fcmc-qvqq,
  # GHSA-w3rx-r6r6-pgpr). Overriding image-size to 2.x breaks Metro 0.82's API.
  'metro@<0.83.8': '0.83.8'
  'zod@>=3.24.0 <4.6.6': '^4.6.7'
auditConfig:
  # Same existing exceptions, keyed by GHSA because registry records omit CVEs.
  # Remove each when an upstream patched version is published.
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # node-forge, CVE-2026-85393: no patched release
    - GHSA-vfj7-8cjw-p6xm # braces, CVE-2026-93687: no patched release
