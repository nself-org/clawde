# Dependabot — GitHub Actions version pinning
# S44-T-SEC-01: keep Actions SHA-pinned via Dependabot PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'ci'
      include: scope
    ignore:
      # setup-node v7 changes how the pnpm store is linked and breaks the
      # Desktop typecheck job. Reverted once in e450991d, then re-landed by
      # mistake via #46. Stay on v6 until the pnpm linking issue is resolved.
      - dependency-name: actions/setup-node
        versions:
          - '>=7'
