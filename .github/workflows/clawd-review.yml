name: ClawDE AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  clawd-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    # Dependabot PRs run with no repo secrets (Actions secrets are withheld from
    # Dependabot-triggered runs) and gain nothing from an AI review of a version
    # bump, so skip cleanly for bot actors instead of trying to serve them.
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ClawDE AI Review
        uses: anthropics/claude-code-action@56cf60fde42f7b19c3abfd5c9c48b69a1288461f # v1.0.222
        with:
          prompt: >
            Review this pull request for:
            1. Security vulnerabilities
            2. Logic errors or edge cases
            3. Missing error handling
            4. Performance issues
            Post a concise review comment with findings grouped by severity.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: 'true'
